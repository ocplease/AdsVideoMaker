<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarmonyOS 播客广告视频制作</title>
  <style>
    :root {
      --purple:#633bb5;
      --teal:#167c80;
      --amber:#9b5b00;
      --bg:#f6f7fb;
      --panel:#fff;
      --line:#dfe3ee;
      --text:#17131f;
      --muted:#655f70;
      --danger:#b42318;
      --success:#147a3d;
    }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif; color:var(--text); background:var(--bg); }
    .page { max-width:1240px; margin:0 auto; padding:24px 18px 48px; }
    header { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:16px 0 20px; }
    .brand { display:flex; align-items:center; gap:16px; min-width:0; }
    .brand img { width:132px; height:auto; object-fit:contain; }
    h1 { font-size:26px; margin:0 0 6px; }
    .sub { color:var(--muted); margin:0; line-height:1.55; }
    .token-bar { display:flex; align-items:end; gap:8px; min-width:360px; }
    .token-bar .field { flex:1; margin:0; }
    .token-state { display:block; min-height:16px; margin-top:5px; color:var(--muted); font-size:12px; }
    .status-banner { margin:0 0 16px; border:1px solid #bfd2f6; border-left-width:5px; border-radius:8px; padding:12px 14px; background:#eef4ff; color:#17315f; font-size:14px; line-height:1.5; overflow-wrap:anywhere; }
    .status-banner.success { border-color:#9dd9b4; background:#edf9f1; color:var(--success); }
    .status-banner.warning { border-color:#f0c36d; background:#fff8e8; color:var(--amber); }
    .status-banner.error { border-color:#f2aaa4; background:#fff1ef; color:var(--danger); }
    .grid { display:grid; grid-template-columns:420px 1fr; gap:16px; align-items:start; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:18px; box-shadow:0 5px 18px rgba(31,35,50,.05); }
    h2 { font-size:18px; margin:0 0 16px; }
    h3 { font-size:15px; margin:0 0 10px; }
    .field { margin-bottom:13px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; }
    input, textarea, select { width:100%; border:1px solid var(--line); border-radius:8px; padding:10px 11px; font:inherit; color:var(--text); background:#fff; }
    textarea { min-height:92px; resize:vertical; line-height:1.55; }
    input:focus, textarea:focus, select:focus { outline:2px solid #d6ecee; border-color:var(--teal); }
    .columns { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .actions, .upload-row { display:flex; align-items:center; gap:8px; }
    .actions { margin-top:18px; }
    button { cursor:pointer; border:0; border-radius:8px; padding:11px 15px; font-size:14px; white-space:nowrap; }
    .primary { background:var(--purple); color:#fff; font-weight:700; flex:1; }
    .secondary { background:#e8edf7; color:#24324f; }
    .ghost { background:#eef8f8; color:var(--teal); }
    .danger { background:#fff1ef; color:var(--danger); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .upload-row { margin-top:8px; }
    .upload-row input[type=file] { padding:7px; font-size:13px; }
    .upload-row button { padding:8px 10px; }
    .reference { display:grid; grid-template-columns:112px 1fr; gap:12px; align-items:start; }
    .reference img { width:112px; border:1px solid var(--line); border-radius:8px; background:#fff; }
    .summary { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin-bottom:14px; }
    .metric { border:1px solid var(--line); border-radius:8px; padding:12px; background:#fbfcff; }
    .metric strong { display:block; font-size:22px; margin-bottom:2px; }
    .metric span { color:var(--muted); font-size:12px; }
    .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; }
    table { width:100%; border-collapse:collapse; min-width:760px; background:#fff; }
    .task-col-video { width:34%; }
    .task-col-status { width:11%; }
    .task-col-created { width:14%; }
    .task-col-detail { width:20%; }
    .task-col-result { width:13%; }
    .task-col-action { width:8%; }
    th, td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; font-size:13px; }
    th { background:#f1f4fa; color:#465166; font-weight:700; }
    tbody tr:last-child td { border-bottom:0; }
    .task-title { font-weight:700; max-width:220px; overflow-wrap:anywhere; }
    .task-id { color:var(--muted); font-family:Consolas,monospace; font-size:12px; overflow-wrap:anywhere; }
    .badge { display:inline-block; border-radius:999px; padding:3px 8px; font-size:12px; font-weight:700; }
    .badge.pending { background:#fff7e6; color:var(--amber); }
    .badge.succeeded { background:#e8f6ee; color:var(--success); }
    .badge.failed, .badge.cancelled { background:#fff1ef; color:var(--danger); }
    .task-link { color:var(--teal); word-break:break-all; }
    .empty-row { color:var(--muted); text-align:center; padding:28px 12px; }
    .saved { margin-top:16px; }
    .saved ul { list-style:none; padding:0; margin:0; display:grid; gap:8px; }
    .saved li { border:1px solid var(--line); border-radius:8px; padding:9px 11px; background:#fff; }
    .saved a { color:var(--teal); word-break:break-all; font-size:13px; }
    .empty { color:var(--muted); font-size:13px; margin:0; }
    @media (max-width:920px) {
      header, .brand, .token-bar { align-items:stretch; flex-direction:column; }
      .token-bar { min-width:0; }
      .grid { grid-template-columns:1fr; }
      .summary { grid-template-columns:repeat(2,minmax(0,1fr)); }
    }
    @media (max-width:560px) {
      body { overflow-x:hidden; }
      .page { width:100%; max-width:none; padding:12px; }
      header { gap:10px; padding:4px 0 12px; }
      .brand { gap:9px; }
      .brand img { width:88px; }
      h1 { font-size:21px; }
      .sub { font-size:13px; }
      .grid, .panel, .token-bar, .status-banner { min-width:0; }
      .panel { width:100%; box-shadow:none; }
      .panel { padding:14px; }
      .status-banner { padding:10px 12px; font-size:13px; }
      .columns { grid-template-columns:1fr; }
      .columns { gap:0; }
      .upload-row, .actions { flex-direction:column; align-items:stretch; }
      .upload-row input[type=file], .upload-row button, .actions button, .token-bar button { width:100%; }
      .reference { grid-template-columns:86px 1fr; }
      .reference img { width:86px; }
      .summary { grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
      .metric { padding:10px; }
      .metric strong { font-size:20px; }
      .table-wrap { border:0; overflow:visible; }
      table, thead, tbody, th, td, tr { display:block; }
      table { min-width:0; background:transparent; }
      colgroup, thead { display:none; }
      tbody { display:grid; gap:10px; }
      tbody tr { border:1px solid var(--line); border-radius:8px; background:#fff; padding:10px 12px; }
      tbody tr:last-child td { border-bottom:1px solid var(--line); }
      td { display:grid; grid-template-columns:86px minmax(0,1fr); gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
      td:last-child { border-bottom:0; }
      td::before { content:attr(data-label); color:var(--muted); font-size:12px; font-weight:700; }
      .task-title { max-width:none; }
      td button { width:100%; }
      .empty-row { display:block; border:1px solid var(--line); border-radius:8px; background:#fff; }
      .empty-row::before { content:""; display:none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="brand">
        <img src="./huawei-podcast-logo.png" alt="HarmonyOS 播客">
        <div>
          <h1>广告视频制作仪表盘</h1>
          <p class="sub">可以连续提交多个视频任务，页面会自动追踪所有未完成任务。</p>
        </div>
      </div>
      <div class="token-bar">
        <div class="field"><label for="apiToken">AD_VIDEO_TOKEN（保存在本浏览器）</label><input id="apiToken" type="password" autocomplete="off" placeholder="请输入 Bearer Token"><span id="tokenState" class="token-state">未填写 Token</span></div>
        <button id="clearToken" class="danger" type="button">清除本地 Token</button>
      </div>
    </header>

    <div id="statusBanner" class="status-banner info">准备就绪。提交任务后可以继续创建下一个视频。</div>

    <div class="grid">
      <main class="panel">
        <h2>新建视频</h2>
        <div class="columns">
          <div class="field"><label for="brand">品牌名称</label><input id="brand"></div>
          <div class="field"><label for="ctaText">CTA 行动文案</label><input id="ctaText"></div>
        </div>
        <div class="field"><label for="title">视频标题</label><input id="title"></div>
        <div class="field"><label for="image">主参考图网址</label><input id="image">
          <div class="upload-row"><input id="mainImageFile" type="file" accept="image/png,image/jpeg"><button class="ghost" type="button" onclick="uploadImage('mainImageFile', 'image', true)">上传主参考图</button></div>
        </div>
        <div class="field"><label for="ctaBackgroundImage">CTA 末帧背景图网址（可选）</label><input id="ctaBackgroundImage" placeholder="https://... 或 asset://...">
          <div class="upload-row"><input id="ctaImageFile" type="file" accept="image/png,image/jpeg"><button class="ghost" type="button" onclick="uploadImage('ctaImageFile', 'ctaBackgroundImage', false)">上传 CTA 背景图</button></div>
        </div>
        <div class="field"><label for="sellingPoints">卖点文案（一行一条）</label><textarea id="sellingPoints"></textarea></div>
        <div class="columns">
          <div class="field"><label for="mode">视频模式</label><select id="mode"><option value="pro">精品 pro</option><option value="fast">快速 fast</option></select></div>
          <div class="field"><label for="execMode">执行模式</label><select id="execMode"><option value="quality">高质量 quality</option><option value="fast">快速 fast</option></select></div>
          <div class="field"><label for="ratio">比例</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:3</option><option>3:4</option><option>21:9</option></select></div>
          <div class="field"><label for="resolution">清晰度</label><select id="resolution"><option>1080p</option><option>720p</option><option>480p</option></select></div>
          <div class="field"><label for="duration">时长（秒）</label><input id="duration" type="number" min="1" max="120"></div>
        </div>
        <div class="reference">
          <img id="preview" src="./podcast-detail.png" alt="当前参考图">
          <p class="empty">当前参考图预览</p>
        </div>
        <div class="actions">
          <button id="reset" class="secondary" type="button">恢复预置</button>
          <button id="submit" class="primary" type="button">开始制作视频</button>
        </div>
      </main>

      <section class="panel">
        <h2>任务队列</h2>
        <div class="summary">
          <div class="metric"><strong id="pendingCount">0</strong><span>生成中</span></div>
          <div class="metric"><strong id="succeededCount">0</strong><span>已完成</span></div>
          <div class="metric"><strong id="failedCount">0</strong><span>未成功</span></div>
          <div class="metric"><strong id="totalCount">0</strong><span>本地记录</span></div>
        </div>
        <div class="table-wrap">
          <table aria-label="视频生成任务队列">
            <colgroup>
              <col class="task-col-video">
              <col class="task-col-status">
              <col class="task-col-created">
              <col class="task-col-detail">
              <col class="task-col-result">
              <col class="task-col-action">
            </colgroup>
            <thead>
              <tr>
                <th>视频</th>
                <th>状态</th>
                <th>创建时间</th>
                <th>完成时间 / 错误</th>
                <th>结果</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="taskTableBody"></tbody>
          </table>
        </div>
        <div class="saved">
          <h3>已保存视频</h3>
          <div id="savedVideos"><p class="empty">正在读取...</p></div>
        </div>
      </section>
    </div>
  </div>
  <script>
    const fields = ["brand", "title", "ctaText", "ctaBackgroundImage", "mode", "execMode", "ratio", "resolution", "duration"];
    const statusBanner = document.getElementById("statusBanner");
    const submit = document.getElementById("submit");
    const savedVideos = document.getElementById("savedVideos");
    const taskTableBody = document.getElementById("taskTableBody");
    const taskStoreKey = "adsVideoMakerTasks";
    const tokenStoreKey = "adVideoMakerToken";
    let pollingTimer = null;
    let pollingInFlight = false;

    function setStatus(message, type = "info") {
      statusBanner.textContent = message;
      statusBanner.className = `status-banner ${type}`;
    }
    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }
    function formatDate(value) {
      if (!value) return "-";
      const date = new Date(value);
      return Number.isNaN(date.getTime()) ? "-" : date.toLocaleString();
    }
    function buildRequestId(scope) {
      return `${scope}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
    }
    async function readJsonResponse(response) {
      const text = await response.text();
      if (!text) {
        return { error: `服务器返回 HTTP ${response.status}，但没有响应内容。` };
      }
      try {
        return JSON.parse(text);
      } catch {
        return { error: `服务器返回 HTTP ${response.status}，但内容格式无法读取。` };
      }
    }
    function readStoredToken() {
      return localStorage.getItem(tokenStoreKey) || "";
    }
    function writeStoredToken(token) {
      if (token) localStorage.setItem(tokenStoreKey, token);
      else localStorage.removeItem(tokenStoreKey);
    }
    function hashTokenScope(token) {
      let hash = 0;
      for (let index = 0; index < token.length; index += 1) {
        hash = ((hash << 5) - hash + token.charCodeAt(index)) | 0;
      }
      return Math.abs(hash).toString(36);
    }
    function tokenScopeKey(baseKey) {
      const apiToken = document.getElementById("apiToken").value.trim();
      return apiToken ? `${baseKey}:${hashTokenScope(apiToken)}` : `${baseKey}:anonymous`;
    }
    function getApiToken() {
      const apiToken = document.getElementById("apiToken").value.trim();
      if (apiToken) writeStoredToken(apiToken);
      return apiToken;
    }
    function updateTokenState(loadedFromStorage = false) {
      const hasToken = Boolean(document.getElementById("apiToken").value.trim());
      document.getElementById("tokenState").textContent = hasToken
        ? (loadedFromStorage ? "本地 Token 已填入" : "Token 已填写")
        : "未填写 Token";
    }
    async function loadDefaults() {
      const response = await fetch("/api/defaults");
      const values = await readJsonResponse(response);
      if (!response.ok || values.error) throw new Error(values.error || "无法读取预置内容");
      fields.forEach((id) => { document.getElementById(id).value = values[id]; });
      document.getElementById("image").value = values.mainReferenceImage;
      document.getElementById("sellingPoints").value = values.sellingPoints.join("\n");
      document.getElementById("preview").src = values.mainReferenceImage;
    }
    function buildPayload() {
      const payload = {
        brand: document.getElementById("brand").value.trim(),
        title: document.getElementById("title").value.trim(),
        mainReferenceImage: document.getElementById("image").value.trim(),
        ctaText: document.getElementById("ctaText").value.trim(),
        sellingPoints: document.getElementById("sellingPoints").value.split(/\n/).map((item) => item.trim()).filter(Boolean),
        mode: document.getElementById("mode").value,
        execMode: document.getElementById("execMode").value,
        ratio: document.getElementById("ratio").value,
        resolution: document.getElementById("resolution").value,
        duration: Number(document.getElementById("duration").value),
      };
      const ctaBackgroundImage = document.getElementById("ctaBackgroundImage").value.trim();
      if (ctaBackgroundImage) payload.ctaBackgroundImage = ctaBackgroundImage;
      return payload;
    }
    function readStoredTasks() {
      try {
        const tasks = JSON.parse(localStorage.getItem(tokenScopeKey(taskStoreKey)) || "[]");
        return Array.isArray(tasks) ? tasks : [];
      } catch {
        return [];
      }
    }
    function writeStoredTasks(tasks) {
      localStorage.setItem(tokenScopeKey(taskStoreKey), JSON.stringify(tasks.slice(0, 20)));
    }
    function rememberTask(taskId, title) {
      const tasks = readStoredTasks().filter((task) => task.taskId !== taskId);
      tasks.unshift({ taskId, title: title || "未命名视频", status: "pending", createdAt: new Date().toISOString() });
      writeStoredTasks(tasks);
      renderTasks();
    }
    function updateStoredTask(taskId, updates) {
      writeStoredTasks(readStoredTasks().map((task) => (
        task.taskId === taskId ? { ...task, ...updates } : task
      )));
      renderTasks();
    }
    function removeTask(taskId) {
      writeStoredTasks(readStoredTasks().filter((task) => task.taskId !== taskId));
      renderTasks();
      startPollingPendingTasks();
    }
    function pendingTasks() {
      return readStoredTasks().filter((task) => task.status === "pending");
    }
    function statusLabel(statusValue) {
      return {
        pending: "生成中",
        succeeded: "已完成",
        failed: "失败",
        cancelled: "已取消",
      }[statusValue] || statusValue || "未知";
    }
    function renderTaskRow(task) {
      const statusValue = escapeHtml(task.status || "pending");
      const result = task.videoUrl
        ? `<a class="task-link" href="${escapeHtml(task.videoUrl)}" target="_blank" rel="noopener">打开视频</a>`
        : "-";
      const detail = task.error ? escapeHtml(task.error) : formatDate(task.completedAt);
      return `<tr>
        <td data-label="视频"><div class="task-title">${escapeHtml(task.title)}</div><div class="task-id">${escapeHtml(task.taskId)}</div></td>
        <td data-label="状态"><span class="badge ${statusValue}">${escapeHtml(statusLabel(task.status))}</span></td>
        <td data-label="创建时间">${escapeHtml(formatDate(task.createdAt))}</td>
        <td data-label="完成时间 / 错误">${detail}</td>
        <td data-label="结果">${result}</td>
        <td data-label="操作"><button class="secondary" type="button" data-remove-task="${escapeHtml(task.taskId)}">移除</button></td>
      </tr>`;
    }
    function renderTasks() {
      const tasks = readStoredTasks();
      const counts = tasks.reduce((result, task) => {
        const key = task.status || "pending";
        result[key] = (result[key] || 0) + 1;
        return result;
      }, {});
      document.getElementById("pendingCount").textContent = counts.pending || 0;
      document.getElementById("succeededCount").textContent = counts.succeeded || 0;
      document.getElementById("failedCount").textContent = (counts.failed || 0) + (counts.cancelled || 0);
      document.getElementById("totalCount").textContent = tasks.length;
      taskTableBody.innerHTML = tasks.length
        ? tasks.map(renderTaskRow).join("")
        : '<tr><td class="empty-row" colspan="6">暂无任务。提交视频后会出现在这里。</td></tr>';
    }
    function renderSavedVideos(videos) {
      if (!videos.length) {
        savedVideos.innerHTML = '<p class="empty">暂无已保存视频。</p>';
        return;
      }
      savedVideos.innerHTML = `<ul>${videos.map((video, index) => {
        const name = video.pathname ? video.pathname.split("/").pop() : `视频 ${index + 1}`;
        return `<li><a href="${escapeHtml(video.url)}" target="_blank" rel="noopener">${escapeHtml(name)}</a></li>`;
      }).join("")}</ul>`;
    }
    async function loadSavedVideos() {
      const apiToken = getApiToken();
      if (!apiToken) {
        savedVideos.innerHTML = '<p class="empty">填写 AD_VIDEO_TOKEN 后显示该 Token 的已保存视频。</p>';
        return;
      }
      try {
        const response = await fetch("/api/videos", { headers: { "X-Ad-Video-Token": apiToken } });
        const data = await readJsonResponse(response);
        if (!response.ok) throw new Error(data.error || "无法读取已保存视频");
        renderSavedVideos(data.videos || []);
      } catch {
        savedVideos.innerHTML = '<p class="empty">暂时无法读取已保存视频。</p>';
      }
    }
    async function uploadImage(fileInputId, urlInputId, updatePreview) {
      const file = document.getElementById(fileInputId).files[0];
      const apiToken = getApiToken();
      if (!apiToken) { setStatus("请先填写 AD_VIDEO_TOKEN，再上传图片。", "warning"); return; }
      if (!file) { setStatus("请先选择需要上传的图片。", "warning"); return; }
      if (![/^image\/png$/, /^image\/jpeg$/].some((rule) => rule.test(file.type))) {
        setStatus("仅支持 PNG 或 JPG 图片。", "warning");
        return;
      }
      if (file.size > 20 * 1024 * 1024) { setStatus("图片不能超过 20 MB。", "warning"); return; }
      setStatus("正在上传图片...");
      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("name", file.name);
        const response = await fetch("/api/upload", {
          method: "POST",
          headers: { "X-Ad-Video-Token": apiToken },
          body: formData,
        });
        const data = await readJsonResponse(response);
        if (!response.ok) throw new Error(data.error || "图片上传失败");
        document.getElementById(urlInputId).value = data.url;
        if (updatePreview) document.getElementById("preview").src = data.url;
        setStatus("图片上传完成，已自动填入图片网址。", "success");
      } catch (error) { handleError(error); }
    }
    async function pollOneTask(taskId) {
      const apiToken = getApiToken();
      if (!apiToken) return;
      const taskTitle = (readStoredTasks().find((task) => task.taskId === taskId) || {}).title || "";
      try {
        const response = await fetch(`/api/status/${encodeURIComponent(taskId)}`, {
          headers: {
            "X-Ad-Video-Token": apiToken,
            "X-Ad-Video-Title": encodeURIComponent(taskTitle),
          },
        });
        const data = await readJsonResponse(response);
        if (!response.ok) {
          updateStoredTask(taskId, { status: "pending", error: data.error || "查询失败，稍后会自动重试" });
          setStatus(`查询任务 ${taskId} 暂时失败，稍后会自动重试：${data.error || "查询失败"}`, "warning");
          return;
        }
        if (data.status === "succeeded") {
          updateStoredTask(taskId, { status: "succeeded", videoUrl: data.video_url, completedAt: new Date().toISOString(), error: "" });
          setStatus(`任务 ${taskId} 已完成，可以继续提交或打开结果。`, "success");
          loadSavedVideos();
        } else if (["failed", "cancelled"].includes(data.status)) {
          updateStoredTask(taskId, { status: data.status, completedAt: new Date().toISOString(), error: data.error || data.status });
          setStatus(`任务 ${taskId} 未成功：${data.error || data.status}`, "error");
        } else {
          updateStoredTask(taskId, { status: "pending", error: "" });
        }
      } catch (error) {
        updateStoredTask(taskId, { status: "pending", error: error.message || "查询失败，稍后会自动重试" });
        setStatus(`查询任务 ${taskId} 暂时失败，稍后会自动重试：${error.message || "查询失败"}`, "warning");
      }
    }
    async function pollAllPendingTasks() {
      if (pollingInFlight) return;
      const tasks = pendingTasks();
      if (!tasks.length) {
        stopPollingPendingTasks();
        return;
      }
      if (!getApiToken()) {
        setStatus(`发现 ${tasks.length} 个未完成任务。填写 AD_VIDEO_TOKEN 后会继续查询。`, "warning");
        return;
      }
      pollingInFlight = true;
      try {
        await Promise.allSettled(tasks.map((task) => pollOneTask(task.taskId)));
      } finally {
        pollingInFlight = false;
        if (!pendingTasks().length) stopPollingPendingTasks();
      }
    }
    function startPollingPendingTasks() {
      if (!pendingTasks().length) {
        stopPollingPendingTasks();
        return;
      }
      if (!getApiToken()) {
        setStatus(`发现 ${pendingTasks().length} 个未完成任务。填写 AD_VIDEO_TOKEN 后会继续查询。`, "warning");
        return;
      }
      if (!pollingTimer) {
        pollingTimer = setInterval(() => pollAllPendingTasks().catch(handleError), 5000);
      }
    }
    function stopPollingPendingTasks() {
      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }
    }
    async function createVideo() {
      submit.disabled = true;
      document.getElementById("preview").src = document.getElementById("image").value.trim();
      setStatus("正在提交视频制作任务...");
      try {
        const apiToken = getApiToken();
        if (!apiToken) {
          setStatus("请先填写 AD_VIDEO_TOKEN。", "warning");
          return;
        }
        const requestId = buildRequestId("create");
        const payload = buildPayload();
        console.info("[ad-video] create request started", {
          requestId,
          title: payload.title,
          imageProvided: Boolean(payload.mainReferenceImage),
          sellingPointCount: payload.sellingPoints.length,
          mode: payload.mode,
          execMode: payload.execMode,
        });
        const response = await fetch("/api/create", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Ad-Video-Token": apiToken, "X-Ad-Debug-Request-Id": requestId },
          body: JSON.stringify(payload),
        });
        const data = await readJsonResponse(response);
        if (!response.ok) {
          console.error("[ad-video] create request rejected", {
            requestId,
            status: response.status,
            error: data.error || "任务创建失败",
            upstreamStatus: data.upstreamStatus,
            location: data.location,
          });
          throw new Error(`${data.error || "任务创建失败"}（调试编号：${requestId}）`);
        }
        rememberTask(data.ad_task_id, payload.title);
        console.info("[ad-video] create request succeeded", {
          requestId,
          taskId: data.ad_task_id,
        });
        setStatus(`任务 ${data.ad_task_id} 已提交。可以继续创建下一个视频。`, "success");
        await pollOneTask(data.ad_task_id);
        startPollingPendingTasks();
      } catch (error) {
        console.error("[ad-video] create request failed", {
          message: error.message,
          name: error.name,
        });
        handleError(error);
      } finally {
        submit.disabled = false;
      }
    }
    function handleError(error) {
      setStatus(`出现错误：${error.message}`, "error");
    }
    document.getElementById("reset").addEventListener("click", () => loadDefaults().then(() => setStatus("已恢复预置内容。", "success")).catch(handleError));
    document.getElementById("clearToken").addEventListener("click", () => {
      document.getElementById("apiToken").value = "";
      writeStoredToken("");
      updateTokenState();
      stopPollingPendingTasks();
      renderTasks();
      loadSavedVideos();
      setStatus("已清除本地 Token。", "success");
    });
    document.getElementById("apiToken").addEventListener("input", () => {
      writeStoredToken(document.getElementById("apiToken").value.trim());
      updateTokenState();
      renderTasks();
      loadSavedVideos();
      startPollingPendingTasks();
    });
    taskTableBody.addEventListener("click", (event) => {
      const button = event.target.closest("[data-remove-task]");
      if (button) removeTask(button.dataset.removeTask);
    });
    submit.addEventListener("click", createVideo);
    const savedToken = readStoredToken();
    document.getElementById("apiToken").value = savedToken;
    updateTokenState(Boolean(savedToken));
    renderTasks();
    loadDefaults().then(() => {
      startPollingPendingTasks();
      pollAllPendingTasks().catch(handleError);
    }).catch(handleError);
    loadSavedVideos();
  </script>
</body>
</html>
