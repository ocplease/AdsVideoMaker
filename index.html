<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HarmonyOS 播客广告视频制作</title>
  <style>
    :root { --purple:#633bb5; --bg:#f5f3f8; --card:#fff; --line:#e6e1ef; --text:#17131f; --muted:#655f70; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:"Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif; color:var(--text); background:var(--bg); }
    .page { max-width:1080px; margin:0 auto; padding:28px 18px 56px; }
    header { display:flex; align-items:center; gap:22px; background:var(--card); border-radius:22px; padding:22px 26px; box-shadow:0 8px 26px rgba(32,18,64,.06); }
    header img { width:170px; height:auto; object-fit:contain; }
    h1 { font-size:27px; margin:0 0 8px; }
    .sub { color:var(--muted); margin:0; line-height:1.55; }
    .grid { display:grid; grid-template-columns:1fr 360px; gap:18px; margin-top:18px; }
    .card { background:var(--card); border-radius:20px; padding:22px; box-shadow:0 5px 20px rgba(32,18,64,.045); }
    h2 { font-size:19px; margin:0 0 18px; }
    .field { margin-bottom:15px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:7px; }
    input, textarea, select { width:100%; border:1px solid var(--line); border-radius:10px; padding:11px 12px; font:inherit; color:var(--text); background:#fff; }
    textarea { min-height:90px; resize:vertical; line-height:1.55; }
    input:focus, textarea:focus, select:focus { outline:2px solid #d9ccfb; border-color:var(--purple); }
    .columns { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .actions { display:flex; gap:12px; margin-top:20px; }
    button { cursor:pointer; border:0; border-radius:12px; padding:13px 21px; font-size:16px; }
    .primary { background:var(--purple); color:#fff; font-weight:700; flex:1; }
    .secondary { background:#ece7f6; color:var(--purple); }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .preview { text-align:center; }
    .phone { width:184px; max-width:100%; margin:0 auto 16px; display:block; }
    .tip { padding:12px 14px; border-radius:12px; background:#f1ebff; color:#56319e; text-align:left; line-height:1.55; font-size:13px; }
    .status { margin-top:16px; min-height:150px; padding:14px; border-radius:12px; background:#17131f; color:#f0eaff; font-size:13px; white-space:pre-wrap; line-height:1.55; overflow-wrap:anywhere; }
    .result a { color:#633bb5; word-break:break-all; }
    @media (max-width:820px) { .grid { grid-template-columns:1fr; } header { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <img src="./huawei-podcast-logo.png" alt="HarmonyOS 播客">
      <div>
        <h1>广告视频一键制作</h1>
        <p class="sub">信息已经预置好。需要调整时修改下面内容，点击“开始制作视频”即可提交并自动查询结果。</p>
      </div>
    </header>
    <div class="grid">
      <main class="card">
        <h2>视频信息</h2>
        <div class="columns">
          <div class="field"><label for="brand">品牌名称</label><input id="brand"></div>
          <div class="field"><label for="ctaText">CTA 行动文案</label><input id="ctaText"></div>
        </div>
        <div class="field"><label for="title">视频标题</label><input id="title"></div>
        <div class="field"><label for="image">主参考图网址</label><input id="image"></div>
        <div class="field"><label for="ctaBackgroundImage">CTA 末帧背景图网址（可选）</label><input id="ctaBackgroundImage" placeholder="https://... 或 asset://..."></div>
        <div class="field"><label for="sellingPoints">卖点文案（一行一条）</label><textarea id="sellingPoints"></textarea></div>
        <div class="columns">
          <div class="field"><label for="mode">视频模式</label><select id="mode"><option value="pro">精品 pro</option><option value="fast">快速 fast</option></select></div>
          <div class="field"><label for="execMode">执行模式</label><select id="execMode"><option value="quality">高质量 quality</option><option value="fast">快速 fast</option></select></div>
          <div class="field"><label for="ratio">比例</label><select id="ratio"><option>9:16</option><option>16:9</option><option>1:1</option><option>4:3</option><option>3:4</option><option>21:9</option></select></div>
          <div class="field"><label for="resolution">清晰度</label><select id="resolution"><option>1080p</option><option>720p</option><option>480p</option></select></div>
          <div class="field"><label for="duration">时长（秒）</label><input id="duration" type="number" min="1" max="120"></div>
        </div>
        <div class="actions">
          <button id="reset" class="secondary" type="button">恢复预置</button>
          <button id="submit" class="primary" type="button">开始制作视频</button>
        </div>
      </main>
      <aside class="card preview">
        <h2>当前参考画面</h2>
        <img id="preview" class="phone" src="./podcast-detail.png" alt="播客界面参考图">
        <div class="tip">默认制作 15 秒中文竖屏视频，结尾显示“立即体验”。生成通常需要 5 至 15 分钟，请保持本页面打开。</div>
        <div id="status" class="status">准备就绪。点击“开始制作视频”。</div>
        <p id="result" class="result"></p>
      </aside>
    </div>
  </div>
  <script>
    const fields = ["brand", "title", "ctaText", "ctaBackgroundImage", "mode", "execMode", "ratio", "resolution", "duration"];
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const submit = document.getElementById("submit");
    let polling = null;

    function setStatus(message) { status.textContent = message; }
    async function readJsonResponse(response) {
      const text = await response.text();
      if (!text) {
        return { error: `服务器返回 HTTP ${response.status}，但没有响应内容。` };
      }
      try {
        return JSON.parse(text);
      } catch {
        return { error: `服务器返回 HTTP ${response.status}，但内容格式无法读取。` };
      }
    }
    async function loadDefaults() {
      const response = await fetch("/api/defaults");
      const values = await readJsonResponse(response);
      if (!response.ok || values.error) throw new Error(values.error || "无法读取预置内容");
      fields.forEach((id) => { document.getElementById(id).value = values[id]; });
      document.getElementById("image").value = values.mainReferenceImage;
      document.getElementById("sellingPoints").value = values.sellingPoints.join("\n");
      document.getElementById("preview").src = values.mainReferenceImage;
    }
    function buildPayload() {
      const payload = {
        brand: document.getElementById("brand").value.trim(),
        title: document.getElementById("title").value.trim(),
        mainReferenceImage: document.getElementById("image").value.trim(),
        ctaText: document.getElementById("ctaText").value.trim(),
        sellingPoints: document.getElementById("sellingPoints").value.split(/\n/).map((item) => item.trim()).filter(Boolean),
        mode: document.getElementById("mode").value,
        execMode: document.getElementById("execMode").value,
        ratio: document.getElementById("ratio").value,
        resolution: document.getElementById("resolution").value,
        duration: Number(document.getElementById("duration").value),
      };
      const ctaBackgroundImage = document.getElementById("ctaBackgroundImage").value.trim();
      if (ctaBackgroundImage) payload.ctaBackgroundImage = ctaBackgroundImage;
      return payload;
    }
    async function pollStatus(taskId) {
      const response = await fetch(`/api/status/${encodeURIComponent(taskId)}`);
      const data = await readJsonResponse(response);
      if (!response.ok) throw new Error(data.error || "查询失败");
      setStatus(`任务编号：${taskId}\n当前状态：${data.status}\n请等待视频生成完成……`);
      if (data.status === "succeeded") {
        clearInterval(polling);
        submit.disabled = false;
        setStatus(`任务编号：${taskId}\n当前状态：已完成\n请点击下方链接查看或保存视频。`);
        result.innerHTML = `<a href="${data.video_url}" target="_blank" rel="noopener">打开生成的视频</a>`;
      } else if (["failed", "cancelled"].includes(data.status)) {
        clearInterval(polling);
        submit.disabled = false;
        setStatus(`任务编号：${taskId}\n生成未成功：${data.error || data.status}`);
      }
    }
    async function createVideo() {
      clearInterval(polling);
      submit.disabled = true;
      result.textContent = "";
      document.getElementById("preview").src = document.getElementById("image").value.trim();
      setStatus("正在提交视频制作任务……");
      try {
        const response = await fetch("/api/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(buildPayload()),
        });
        const data = await readJsonResponse(response);
        if (!response.ok) throw new Error(data.error || "任务创建失败");
        setStatus(`任务编号：${data.ad_task_id}\n当前状态：已提交\n正在等待制作……`);
        await pollStatus(data.ad_task_id);
        polling = setInterval(() => pollStatus(data.ad_task_id).catch(handleError), 5000);
      } catch (error) { handleError(error); }
    }
    function handleError(error) {
      clearInterval(polling);
      submit.disabled = false;
      setStatus(`出现错误：${error.message}`);
    }
    document.getElementById("reset").addEventListener("click", () => loadDefaults().then(() => setStatus("已恢复预置内容。")));
    submit.addEventListener("click", createVideo);
    loadDefaults().catch(handleError);
  </script>
</body>
</html>
